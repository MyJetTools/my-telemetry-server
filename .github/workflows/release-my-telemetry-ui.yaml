name: Release my-telemetry-ui
on:
  push:
    tags:
      - "my-telemetry-ui-[0-9]*"

env:
  IMAGE_NAME: ghcr.io/myjettools/my-telemetry-ui
  DIR: my-telemetry-ui

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.2
        with:
          toolchain: stable
          # The crate is in a folder of the repository, so its target/ is too
          cache-workspaces: "${{ env.DIR }} -> target"
          # The action defaults to `-D warnings`: a warning must not fail a release
          rustflags: ""

      # The tag is my-telemetry-ui-<version>
      - name: Get the version
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG##*-}" >> "$GITHUB_OUTPUT"

      - name: Updating version
        run: |
          cd ${DIR}
          sed -i -e 's/^version = .*/version = "${{ steps.get_version.outputs.VERSION }}"/' Cargo.toml

      # build.rs compiles ../proto-files
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The client is not built here: wwwroot/ is built by ./build-ui.sh and committed
      - run: |
          cd ${DIR}
          cargo build --release

      - name: Docker login
        run: echo "${{ secrets.PUBLISH_TOKEN }}" | docker login https://ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Docker Build and Publish
        run: |
          cd ${DIR}
          docker build -t ${IMAGE_NAME}:${{ steps.get_version.outputs.VERSION }} .
          docker push ${IMAGE_NAME}:${{ steps.get_version.outputs.VERSION }}
