[package]
name = "my-telemetry-ui-client"
version = "0.1.0"
edition = "2021"

# The telemetry UI, compiled to wasm and served by my-telemetry-ui out of
# `../my-telemetry-ui/wwwroot`. Client-side only: there are no `#[server]` functions -
# every call goes to the `/ui/*` REST endpoints of the very server that served this
# page, which reads the my-telemetry-server of the env over gRPC.

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
# Kept on the 0.7 line on purpose: dioxus-utils requires `dioxus = "0.7"`, and the
# `dx` CLI that builds this crate has to match the library's minor version.
dioxus = { version = "0.7", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

# Wire models shared verbatim with the server. Pulled in WITHOUT the "server"
# feature - the client only needs the schema plus the FlUrl request builder.
my-telemetry-ui-shared = { path = "../my-telemetry-ui-shared" }

# For its my-json re-export: responses are read with the `JsonValueReader` the
# shared models derive, not with serde.
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git" }

# Compiles to the browser fetch API under wasm and resolves relative "/ui/..." URLs.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "base64",
] }

web-sys = { version = "*", features = ["Storage", "Window"] }
js-sys = { version = "*" }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

# The release profile of the my-prop-trading web clients. dx then runs wasm-opt on top
# of it at its default release level, -Oz.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
